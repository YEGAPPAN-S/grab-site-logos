<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrabLogo — Site Logo & Image Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f;
    --surface: #15151a;
    --surface-2: #1c1c23;
    --border: #2a2a35;
    --border-hover: #3a3a48;
    --text: #e8e8ec;
    --text-dim: #8888a0;
    --accent: #22d67a;
    --accent-dim: #1aad62;
    --accent-glow: rgba(34, 214, 122, 0.12);
    --red: #ef4444;
    --red-dim: rgba(239, 68, 68, 0.15);
    --yellow: #f59e0b;
    --blue: #60a5fa;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1060px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 48px; }
  .logo-mark { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo-mark svg { width: 36px; height: 36px; }
  .logo-mark span {
    font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent) 0%, #6ee7b7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--text-dim); font-size: 15px; }

  /* Input Section */
  .input-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; margin-bottom: 20px;
  }
  .tabs {
    display: flex; gap: 4px; background: var(--bg);
    border-radius: var(--radius-sm); padding: 4px; margin-bottom: 24px; width: fit-content;
  }
  .tab {
    font-family: 'DM Sans', sans-serif; padding: 8px 20px; border: none; border-radius: 6px;
    background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab.active { background: var(--surface-2); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }

  .single-input { display: flex; gap: 10px; }
  .single-input input { flex: 1; }

  input, textarea {
    width: 100%; font-family: 'Space Mono', monospace; font-size: 13px; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); outline: none; transition: border-color 0.2s;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input::placeholder, textarea::placeholder { color: var(--text-dim); opacity: 0.6; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.8; }
  .bulk-hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }

  /* Buttons */
  .btn {
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; padding: 14px 28px;
    border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #0c0c0f; }
  .btn-primary:hover { background: var(--accent-dim); transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-hover); background: var(--border); }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.25); }

  /* Actions bar */
  .actions-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .result-count { font-size: 13px; color: var(--text-dim); font-family: 'Space Mono', monospace; }
  .result-count strong { color: var(--accent); }
  .actions-right { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Loading */
  .loading-bar { height: 3px; background: var(--surface); border-radius: 2px; margin-bottom: 24px; overflow: hidden; display: none; }
  .loading-bar.active { display: block; }
  .loading-bar::after {
    content: ''; display: block; height: 100%; width: 30%; background: var(--accent);
    border-radius: 2px; animation: loadSlide 1.2s ease infinite;
  }
  @keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }

  /* Site Groups */
  .site-group { margin-bottom: 36px; animation: groupIn 0.4s ease both; }
  @keyframes groupIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .site-group-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .sg-favicon { width: 20px; height: 20px; border-radius: 4px; }
  .sg-domain { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: var(--text); }
  .sg-status { font-size: 11px; margin-left: auto; font-weight: 600; }
  .sg-status.scanning { color: var(--yellow); }
  .sg-status.done { color: var(--accent); }
  .sg-status.error { color: var(--red); }

  .site-group-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px;
  }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; transition: all 0.25s; position: relative; animation: cardIn 0.35s ease both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

  .card-select {
    position: absolute; top: 10px; left: 10px; z-index: 3; width: 22px; height: 22px;
    border-radius: 6px; border: 2px solid var(--border-hover); background: var(--surface);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; opacity: 0;
  }
  .card:hover .card-select, .card-select.checked { opacity: 1; }
  .card-select.checked { background: var(--accent); border-color: var(--accent); }
  .card-select.checked::after { content: '✓'; color: #0c0c0f; font-size: 12px; font-weight: 700; }

  .card-img-wrap {
    height: 150px; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: repeating-conic-gradient(var(--bg) 0% 25%, var(--surface-2) 0% 50%) 50% / 16px 16px;
    position: relative; cursor: pointer; overflow: hidden;
  }
  .card-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .card-img-wrap .img-error { color: var(--red); font-size: 12px; text-align: center; }

  .source-badge {
    position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 4px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2;
  }
  .badge-logo { color: var(--accent); }
  .badge-favicon { color: var(--blue); }
  .badge-screenshot { color: var(--yellow); }

  .card-info { padding: 10px 14px; border-top: 1px solid var(--border); }
  .card-filename {
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
  }
  .card-meta {
    font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .card-actions { display: flex; padding: 0 14px 10px; gap: 6px; }
  .card-btn {
    flex: 1; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 7px 0;
    border: 1px solid var(--border); border-radius: 6px; background: transparent;
    color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .card-btn:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface-2); }
  .card-btn.dl:hover { border-color: var(--accent); color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 40px; cursor: pointer;
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: var(--radius); cursor: default; }

  /* Empty state */
  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-state svg { margin-bottom: 20px; opacity: 0.15; }
  .empty-state p { color: var(--text-dim); font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.7; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 12px 24px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500;
    z-index: 999; transition: transform 0.3s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .card-spinner {
    width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    .app { padding: 24px 16px 60px; }
    .single-input { flex-direction: column; }
    .site-group-cards { grid-template-columns: 1fr 1fr; }
    .actions-bar { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#22d67a" fill-opacity="0.12"/><path d="M10 20l4-8 4 6 3-3 5 7H10z" fill="#22d67a" opacity="0.6"/><circle cx="24" cy="13" r="3" fill="#22d67a"/></svg>
      <span>GrabLogo</span>
    </div>
    <p class="tagline">Scan any site and grab its logo, favicon & screenshot — single or bulk.</p>
  </div>

  <!-- Input -->
  <div class="input-section">
    <div class="tabs">
      <button class="tab active" data-mode="single" onclick="switchMode('single')">Single</button>
      <button class="tab" data-mode="bulk" onclick="switchMode('bulk')">Bulk</button>
    </div>
    <div id="singleMode" class="input-group">
      <div class="single-input">
        <input type="text" id="singleUrl" placeholder="https://example.com" spellcheck="false" onkeydown="if(event.key==='Enter') grabLogos()">
        <button class="btn btn-primary" onclick="grabLogos()" id="grabBtn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Grab
        </button>
      </div>
    </div>
    <div id="bulkMode" class="input-group hidden">
      <textarea id="bulkUrls" placeholder="https://example.com&#10;https://another-site.com&#10;https://one-more.io" spellcheck="false"></textarea>
      <p class="bulk-hint">One URL per line · Max 50 at a time</p>
      <div style="margin-top: 14px">
        <button class="btn btn-primary" onclick="grabLogos()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Grab All
        </button>
      </div>
    </div>
  </div>

  <div class="loading-bar" id="loadingBar"></div>

  <!-- Actions -->
  <div class="actions-bar hidden" id="actionsBar">
    <div class="result-count" id="resultCount"></div>
    <div class="actions-right">
      <button class="btn btn-secondary" onclick="selectAll()" id="selectAllBtn">Select All</button>
      <button class="btn btn-primary" onclick="downloadSelected()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download Selected
      </button>
      <button class="btn btn-danger" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsArea">
    <div class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <p>Enter a website URL and we'll scan its HTML to find the logo, grab the favicon, and take a desktop screenshot.</p>
    </div>
    <div id="resultsContainer" class="hidden"></div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal" onclick="closePreview()">
  <img id="previewImg" src="" alt="Preview">
</div>

<div class="toast" id="toast"></div>

<script>
let currentMode = 'single';
let results = [];
let allSelected = false;

// ─── CORS Proxies (chained fallback) ───
const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
];

async function fetchWithProxy(url) {
  for (const proxy of CORS_PROXIES) {
    try {
      const resp = await fetch(proxy(url), { signal: AbortSignal.timeout(12000) });
      if (resp.ok) {
        const text = await resp.text();
        if (text && text.length > 200) return text;
      }
    } catch (e) { /* try next proxy */ }
  }
  return null;
}

// ─── DOM Scanner: Extract logos from HTML ───
function extractLogosFromHTML(html, baseUrl) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const base = new URL(baseUrl);
  const found = [];

  function resolveUrl(src) {
    if (!src || src.startsWith('data:')) return null;
    try {
      if (src.startsWith('//')) return base.protocol + src;
      if (src.startsWith('/')) return base.origin + src;
      if (src.startsWith('http')) return src;
      return new URL(src, baseUrl).href;
    } catch { return null; }
  }

  function isLogoSignal(el) {
    const check = [
      el.getAttribute('class') || '',
      el.getAttribute('id') || '',
      el.getAttribute('alt') || '',
      el.getAttribute('title') || '',
      el.getAttribute('src') || '',
      el.getAttribute('data-src') || '',
      el.getAttribute('aria-label') || '',
    ].join(' ').toLowerCase();
    return /logo/i.test(check);
  }

  function isSVGLogo(el) {
    const check = [
      el.getAttribute('class') || '',
      el.getAttribute('id') || '',
      el.getAttribute('aria-label') || '',
      el.closest('[class*="logo"], [id*="logo"]') ? 'logo' : '',
    ].join(' ').toLowerCase();
    return /logo/i.test(check);
  }

  // ── Priority 1: <img> with logo in class/id/alt/src ──
  doc.querySelectorAll('img').forEach(img => {
    if (isLogoSignal(img)) {
      const src = resolveUrl(img.getAttribute('src') || img.getAttribute('data-src') || img.getAttribute('data-lazy-src') || img.getAttribute('srcset')?.split(',')[0]?.trim()?.split(' ')[0]);
      if (src) found.push({ src, score: 100, reason: 'img with logo signal' });
    }
  });

  // ── Priority 2: <img> inside <header> or <nav> (first image) ──
  doc.querySelectorAll('header img, nav img, [role="banner"] img').forEach((img, i) => {
    if (i > 2) return; // only first few
    const src = resolveUrl(img.getAttribute('src') || img.getAttribute('data-src'));
    if (src) found.push({ src, score: 80 - i * 5, reason: 'img inside header/nav' });
  });

  // ── Priority 3: <a> linking to homepage containing <img> ──
  doc.querySelectorAll('a[href="/"] img, a[href="' + baseUrl + '"] img, a[href="' + base.origin + '"] img, a[href="' + base.origin + '/"] img').forEach((img, i) => {
    if (i > 1) return;
    const src = resolveUrl(img.getAttribute('src') || img.getAttribute('data-src'));
    if (src) found.push({ src, score: 75 - i * 5, reason: 'img in homepage link' });
  });

  // ── Priority 4: <svg> with logo class/id ──
  doc.querySelectorAll('svg').forEach(svg => {
    if (isSVGLogo(svg)) {
      // We can't easily extract SVG as image URL, but we note it
      found.push({ src: null, score: 60, reason: 'SVG logo (inline)', isSvg: true, svgEl: svg });
    }
  });

  // ── Priority 5: <link> with logo/icon in href ──
  doc.querySelectorAll('link[rel*="icon"], link[rel*="apple-touch"], link[rel*="shortcut"]').forEach(link => {
    const src = resolveUrl(link.getAttribute('href'));
    const sizes = link.getAttribute('sizes') || '';
    const sizeVal = parseInt(sizes) || 0;
    if (src) found.push({ src, score: 40 + Math.min(sizeVal / 10, 20), reason: `link icon ${sizes}` });
  });

  // ── Priority 6: og:image ──
  const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
  if (ogImage) {
    const src = resolveUrl(ogImage);
    if (src) found.push({ src, score: 35, reason: 'og:image' });
  }

  // ── Priority 7: twitter:image ──
  const twImage = doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content') ||
                  doc.querySelector('meta[property="twitter:image"]')?.getAttribute('content');
  if (twImage) {
    const src = resolveUrl(twImage);
    if (src) found.push({ src, score: 30, reason: 'twitter:image' });
  }

  // Deduplicate by src & sort by score
  const seen = new Set();
  const unique = [];
  for (const item of found.sort((a, b) => b.score - a.score)) {
    if (!item.src || seen.has(item.src)) continue;
    seen.add(item.src);
    unique.push(item);
  }

  return unique.slice(0, 5); // top 5 logo candidates
}

// ─── Helpers ───
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('singleMode').classList.toggle('hidden', mode !== 'single');
  document.getElementById('bulkMode').classList.toggle('hidden', mode !== 'bulk');
}

function parseUrls() {
  if (currentMode === 'single') {
    const v = document.getElementById('singleUrl').value.trim();
    return v ? [v] : [];
  }
  return document.getElementById('bulkUrls').value.split('\n').map(u => u.trim()).filter(u => u.length > 0).slice(0, 50);
}

function normalizeUrl(url) {
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { return new URL(url).href; } catch { return null; }
}

function getDomain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}

function genName(domain, type) {
  return `${domain.replace(/[^a-z0-9]/gi, '-')}-${type}`;
}

// ─── Main: Grab Logos ───
async function grabLogos() {
  const rawUrls = parseUrls();
  if (!rawUrls.length) { showToast('Enter at least one URL'); return; }

  const urls = rawUrls.map(normalizeUrl).filter(Boolean);
  if (!urls.length) { showToast('No valid URLs found'); return; }

  document.getElementById('loadingBar').classList.add('active');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('resultsContainer').classList.remove('hidden');
  document.getElementById('actionsBar').classList.remove('hidden');
  document.getElementById('grabBtn').disabled = true;

  const container = document.getElementById('resultsContainer');

  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    const domain = getDomain(url);

    // Create site group
    const group = document.createElement('div');
    group.className = 'site-group';
    group.style.animationDelay = `${i * 0.1}s`;
    group.innerHTML = `
      <div class="site-group-header">
        <img class="sg-favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" onerror="this.style.display='none'" alt="">
        <span class="sg-domain">${escHtml(domain)}</span>
        <span class="sg-status scanning" id="status-${i}">⏳ Scanning DOM...</span>
      </div>
      <div class="site-group-cards" id="cards-${i}"></div>
    `;
    container.appendChild(group);

    const cardsEl = document.getElementById(`cards-${i}`);
    const statusEl = document.getElementById(`status-${i}`);

    try {
      // Step 1: Fetch HTML via CORS proxy
      statusEl.textContent = '⏳ Fetching HTML...';
      const html = await fetchWithProxy(url);

      if (!html) {
        statusEl.textContent = '⚠ Could not fetch site (proxies blocked)';
        statusEl.className = 'sg-status error';
        // Still add favicon + screenshot
        addCard(cardsEl, domain, {
          src: `https://icons.duckduckgo.com/ip3/${domain}.ico`,
          name: genName(domain, 'favicon'), label: 'Favicon', badge: 'FAVICON', badgeClass: 'badge-favicon',
        });
        addCard(cardsEl, domain, {
          src: `https://image.thum.io/get/width/1280/crop/800/${url}`,
          name: genName(domain, 'screenshot-1280x800'), label: 'Screenshot 1280×800', badge: 'SCREENSHOT', badgeClass: 'badge-screenshot',
        });
        updateCount();
        continue;
      }

      // Step 2: Parse & extract logos
      statusEl.textContent = '🔍 Scanning for logos...';
      const logos = extractLogosFromHTML(html, url);

      if (logos.length > 0) {
        // Add top logo candidates (max 3)
        logos.slice(0, 3).forEach((logo, idx) => {
          addCard(cardsEl, domain, {
            src: logo.src,
            name: genName(domain, idx === 0 ? 'logo' : `logo-${idx + 1}`),
            label: idx === 0 ? `Logo — ${logo.reason}` : `Logo alt ${idx + 1} — ${logo.reason}`,
            badge: idx === 0 ? 'LOGO' : `LOGO ${idx + 1}`,
            badgeClass: 'badge-logo',
          });
        });
        statusEl.textContent = `✓ Found ${logos.length} logo(s)`;
        statusEl.className = 'sg-status done';
      } else {
        statusEl.textContent = '⚠ No logos found in DOM';
        statusEl.className = 'sg-status error';
      }

      // Step 3: Always add favicon
      addCard(cardsEl, domain, {
        src: `https://icons.duckduckgo.com/ip3/${domain}.ico`,
        name: genName(domain, 'favicon'), label: 'Favicon', badge: 'FAVICON', badgeClass: 'badge-favicon',
      });

      // Step 4: Always add screenshot (1280x800)
      addCard(cardsEl, domain, {
        src: `https://image.thum.io/get/width/1280/crop/800/${url}`,
        name: genName(domain, 'screenshot-1280x800'), label: 'Screenshot 1280×800', badge: 'SCREENSHOT', badgeClass: 'badge-screenshot',
      });

      updateCount();

    } catch (err) {
      statusEl.textContent = `✗ Error: ${err.message}`;
      statusEl.className = 'sg-status error';
    }
  }

  document.getElementById('loadingBar').classList.remove('active');
  document.getElementById('grabBtn').disabled = false;
  updateCount();
}

// ─── Add a card to a site group ───
function addCard(container, domain, opts) {
  const id = results.length;
  results.push({ ...opts, domain, selected: false, id, failed: false });

  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${(id % 12) * 0.06}s`;
  card.id = `card-${id}`;
  card.innerHTML = `
    <div class="card-select" onclick="toggleSelect(${id}, event)" id="sel-${id}"></div>
    <div class="source-badge ${opts.badgeClass || ''}">${escHtml(opts.badge)}</div>
    <div class="card-img-wrap">
      <div class="card-spinner"></div>
    </div>
    <div class="card-info">
      <div class="card-filename" title="${escHtml(opts.name)}">${escHtml(opts.name)}</div>
      <div class="card-meta">${escHtml(opts.label)}</div>
    </div>
    <div class="card-actions">
      <button class="card-btn dl" onclick="downloadSingle(${id})">Download</button>
      <button class="card-btn" onclick="copyUrl(${id})">Copy URL</button>
    </div>
  `;
  container.appendChild(card);
  loadCardImage(id, opts.src);
}

function loadCardImage(id, src) {
  const card = document.getElementById(`card-${id}`);
  const wrap = card.querySelector('.card-img-wrap');
  const img = new Image();
  // No crossOrigin — display works fine without it
  img.onload = () => {
    // Check if it's a tiny placeholder (1x1 pixel trackers etc)
    if (img.naturalWidth <= 2 && img.naturalHeight <= 2) {
      wrap.innerHTML = '<span class="img-error">⚠ Tiny image (tracker)</span>';
      results[id].failed = true;
      updateCount();
      return;
    }
    wrap.innerHTML = '';
    img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;';
    wrap.appendChild(img);
    wrap.onclick = () => previewImage(src);
  };
  img.onerror = () => {
    wrap.innerHTML = '<span class="img-error">⚠ Failed to load</span>';
    results[id].failed = true;
    updateCount();
  };
  img.src = src;
}

// ─── Selection ───
function toggleSelect(id, e) {
  e.stopPropagation();
  results[id].selected = !results[id].selected;
  document.getElementById(`sel-${id}`).classList.toggle('checked', results[id].selected);
  updateCount();
}

function selectAll() {
  allSelected = !allSelected;
  results.forEach((r, i) => {
    if (!r.failed) {
      r.selected = allSelected;
      const el = document.getElementById(`sel-${i}`);
      if (el) el.classList.toggle('checked', allSelected);
    }
  });
  document.getElementById('selectAllBtn').textContent = allSelected ? 'Deselect All' : 'Select All';
  updateCount();
}

function updateCount() {
  const total = results.filter(r => !r.failed).length;
  const selected = results.filter(r => r.selected && !r.failed).length;
  document.getElementById('resultCount').innerHTML =
    `<strong>${total}</strong> images${selected ? ` · <strong>${selected}</strong> selected` : ''}`;
}

// ─── Downloads ───
async function downloadSingle(id) {
  const r = results[id];
  if (r.failed) { showToast('Cannot download failed image'); return; }

  showToast('Downloading...');
  const ok = await downloadViaFetch(r.src, r.name);
  if (ok) { showToast('Downloaded!'); }
  else {
    window.open(r.src, '_blank');
    showToast('Opened in new tab — right-click to save');
  }
}

async function downloadViaFetch(url, filename) {
  try {
    // Try direct fetch first
    let resp = await fetch(url, { signal: AbortSignal.timeout(10000) });

    // If CORS blocked, try via proxy
    if (!resp.ok) {
      for (const proxy of CORS_PROXIES) {
        try {
          resp = await fetch(proxy(url), { signal: AbortSignal.timeout(10000) });
          if (resp.ok) break;
        } catch {}
      }
    }

    if (!resp.ok) return false;
    const blob = await resp.blob();
    if (blob.size < 50) return false;
    const ext = getExt(blob.type, url);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${filename}.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    return true;
  } catch {
    return false;
  }
}

async function downloadSelected() {
  const sel = results.filter(r => r.selected && !r.failed);
  if (!sel.length) { showToast('No images selected'); return; }

  showToast(`Downloading ${sel.length} image(s)...`);
  let ok = 0, fallback = 0;

  for (const r of sel) {
    const success = await downloadViaFetch(r.src, r.name);
    if (success) ok++;
    else { window.open(r.src, '_blank'); fallback++; }
    await sleep(400);
  }

  showToast(fallback > 0
    ? `${ok} downloaded · ${fallback} opened in tabs`
    : `${ok} image(s) downloaded!`);
}

function getExt(mime, url) {
  if (mime.includes('svg')) return 'svg';
  if (mime.includes('png')) return 'png';
  if (mime.includes('gif')) return 'gif';
  if (mime.includes('webp')) return 'webp';
  if (mime.includes('jpeg') || mime.includes('jpg')) return 'jpg';
  if (mime.includes('icon')) return 'ico';
  // Guess from URL
  const m = url.match(/\.(png|jpg|jpeg|gif|svg|webp|ico)(\?|$)/i);
  if (m) return m[1].toLowerCase();
  return 'png';
}

function copyUrl(id) {
  navigator.clipboard.writeText(results[id].src).then(() => showToast('URL copied!'));
}

function clearAll() {
  results = [];
  allSelected = false;
  document.getElementById('resultsContainer').innerHTML = '';
  document.getElementById('resultsContainer').classList.add('hidden');
  document.getElementById('actionsBar').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  document.getElementById('selectAllBtn').textContent = 'Select All';
}

// ─── UI Helpers ───
function previewImage(src) {
  document.getElementById('previewImg').src = src;
  document.getElementById('previewModal').classList.add('open');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2800);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });
</script>
