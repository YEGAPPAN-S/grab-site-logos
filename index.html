<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrabLogo — Site Logo & Image Downloader</title>
<link rel="icon" href="https://www.retainful.com/wp-content/uploads/2021/03/retainful-fav-icon.svg" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0f; --surface: #15151a; --surface-2: #1c1c23;
    --border: #2a2a35; --border-hover: #3a3a48;
    --text: #e8e8ec; --text-dim: #8888a0;
    --accent: #f75a1b; --accent-dim: #fcbaa0; --accent-glow: #fee3d965;
    --red: #ef4444; --red-dim: rgba(239,68,68,0.15);
    --yellow: #f59e0b; --blue: #60a5fa; --purple: #c084fc;
    --radius: 12px; --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none; z-index: 0;
  }
  .app { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 40px 24px 80px; }
  .header { text-align: center; margin-bottom: 48px; }
  .logo-mark { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo-mark svg { width: 36px; height: 36px; }
  .logo-mark span {
    font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent) 0%, #fcc8b3 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--text-dim); font-size: 15px; }
  .input-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 24px; width: fit-content; }
  .tab { font-family: 'DM Sans', sans-serif; padding: 8px 20px; border: none; border-radius: 6px; background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .tab.active { background: var(--surface-2); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }
  .single-input { display: flex; gap: 10px; }
  .single-input input { flex: 1; }
  input, textarea { width: 100%; font-family: 'Space Mono', monospace; font-size: 13px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); outline: none; transition: border-color 0.2s; }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input::placeholder, textarea::placeholder { color: var(--text-dim); opacity: 0.6; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.8; }
  .bulk-hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
  .btn { font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px; padding: 14px 28px; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: #0c0c0f; }
  .btn-primary:hover { background: var(--accent-dim); transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-hover); background: var(--border); }
  .btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
  .btn-danger:hover { background: rgba(239,68,68,0.25); }
  .actions-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .result-count { font-size: 13px; color: var(--text-dim); font-family: 'Space Mono', monospace; }
  .result-count strong { color: var(--accent); }
  .actions-right { display: flex; gap: 8px; flex-wrap: wrap; }
  .loading-bar { height: 3px; background: var(--surface); border-radius: 2px; margin-bottom: 24px; overflow: hidden; display: none; }
  .loading-bar.active { display: block; }
  .loading-bar::after { content: ''; display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: loadSlide 1.2s ease infinite; }
  @keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
  .proxy-status { font-size: 11px; color: var(--text-dim); text-align: center; margin-bottom: 16px; font-family: 'Space Mono', monospace; }
  .proxy-status .pok { color: var(--accent); }
  .proxy-status .pfail { color: var(--red); }
  .site-group { margin-bottom: 36px; animation: groupIn 0.4s ease both; }
  @keyframes groupIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; } }
  .site-group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .sg-favicon { width: 20px; height: 20px; border-radius: 4px; }
  .sg-domain { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; }
  .sg-status { font-size: 11px; margin-left: auto; font-weight: 600; }
  .sg-status.scanning { color: var(--yellow); }
  .sg-status.done { color: var(--accent); }
  .sg-status.error { color: var(--red); }
  .sg-status.partial { color: var(--yellow); }
  .site-group-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.25s; position: relative; animation: cardIn 0.35s ease both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .card.dimmed { opacity: 0.35; pointer-events: none; }
  .card-select { position: absolute; top: 10px; left: 10px; z-index: 3; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border-hover); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; opacity: 0; }
  .card:hover .card-select, .card-select.checked { opacity: 1; }
  .card-select.checked { background: var(--accent); border-color: var(--accent); }
  .card-select.checked::after { content: '✓'; color: #0c0c0f; font-size: 12px; font-weight: 700; }
  .card-img-wrap { height: 150px; display: flex; align-items: center; justify-content: center; padding: 16px; background: repeating-conic-gradient(var(--bg) 0% 25%, var(--surface-2) 0% 50%) 50%/16px 16px; position: relative; cursor: pointer; overflow: hidden; }
  .card-img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .card-img-wrap .img-error { color: var(--red); font-size: 11px; text-align: center; line-height: 1.5; }
  .source-badge { position: absolute; top: 10px; right: 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2; }
  .badge-logo { color: var(--accent); }
  .badge-favicon { color: var(--blue); }
  .badge-screenshot { color: var(--yellow); }
  .badge-og { color: var(--purple); }
  .card-info { padding: 10px 14px; border-top: 1px solid var(--border); }
  .card-filename { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .card-meta { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-dim { font-size: 9px; color: var(--text-dim); margin-top: 2px; font-family: 'Space Mono', monospace; }
  .card-actions { display: flex; padding: 0 14px 10px; gap: 6px; }
  .card-btn { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; padding: 7px 0; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-align: center; }
  .card-btn:hover { color: var(--text); border-color: var(--border-hover); background: var(--surface-2); }
  .card-btn.dl:hover { border-color: var(--accent); color: var(--accent); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; display: none; align-items: center; justify-content: center; padding: 40px; cursor: pointer; }
  .modal-overlay.open { display: flex; }
  .modal-overlay img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: var(--radius); cursor: default; }
  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-state svg { margin-bottom: 20px; opacity: 0.15; }
  .empty-state p { color: var(--text-dim); font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.7; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; z-index: 999; transition: transform 0.3s ease; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .card-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  @media (max-width: 640px) { .app { padding: 24px 16px 60px; } .single-input { flex-direction: column; } .site-group-cards { grid-template-columns: 1fr 1fr; } .actions-bar { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#f75a1b" fill-opacity="0.12"/><path d="M10 20l4-8 4 6 3-3 5 7H10z" fill="#f75a1b" opacity="0.6"/><circle cx="24" cy="13" r="3" fill="#f75a1b"/></svg>
      <span>GrabLogo</span>
    </div>
    <p class="tagline">Scan any site's DOM and grab its logo, favicon & screenshot — single or bulk.</p>
  </div>
  <div class="input-section">
    <div class="tabs">
      <button class="tab active" data-mode="single" onclick="switchMode('single')">Single</button>
      <button class="tab" data-mode="bulk" onclick="switchMode('bulk')">Bulk</button>
    </div>
    <div id="singleMode" class="input-group">
      <div class="single-input">
        <input type="text" id="singleUrl" placeholder="https://example.com" spellcheck="false" onkeydown="if(event.key==='Enter') grabLogos()">
        <button class="btn btn-primary" onclick="grabLogos()" id="grabBtn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Grab
        </button>
      </div>
    </div>
    <div id="bulkMode" class="input-group hidden">
      <textarea id="bulkUrls" placeholder="https://example.com&#10;https://another-site.com&#10;https://one-more.io" spellcheck="false"></textarea>
      <p class="bulk-hint">One URL per line · Max 50 at a time</p>
      <div style="margin-top: 14px">
        <button class="btn btn-primary" onclick="grabLogos()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          Grab All
        </button>
      </div>
    </div>
  </div>
  <div class="proxy-status" id="proxyStatus"></div>
  <div class="loading-bar" id="loadingBar"></div>
  <div class="actions-bar hidden" id="actionsBar">
    <div class="result-count" id="resultCount"></div>
    <div class="actions-right">
      <button class="btn btn-secondary" onclick="selectAll()" id="selectAllBtn">Select All</button>
      <button class="btn btn-primary" onclick="downloadSelected()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Download Selected
      </button>
      <button class="btn btn-danger" onclick="clearAll()">Clear</button>
    </div>
  </div>
  <div id="resultsArea">
    <div class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <p>Enter a website URL and we'll scan its DOM to extract the real logo, favicon, and a 1280×800 desktop screenshot.</p>
    </div>
    <div id="resultsContainer" class="hidden"></div>
  </div>
</div>
<div class="modal-overlay" id="previewModal" onclick="closePreview()"><img id="previewImg" src="" alt="Preview"></div>
<div class="toast" id="toast"></div>

<script>
let currentMode = 'single';
let results = [];
let allSelected = false;
let workingProxy = null;

// ─── CORS PROXIES ───
const CORS_PROXIES = [
  { name: 'codetabs', build: u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}` },
  { name: 'corsproxy.io', build: u => `https://corsproxy.io/?url=${encodeURIComponent(u)}` },
  { name: 'everyorigin', build: u => `https://everyorigin.jwvbremen.nl/api/get?url=${encodeURIComponent(u)}`, isJson: true },
  { name: 'allorigins', build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}` },
  { name: 'thingproxy', build: u => `https://thingproxy.freeboard.io/fetch/${u}` },
];

async function fetchHTML(url) {
  const s = document.getElementById('proxyStatus');
  // Try cached proxy first
  if (workingProxy) {
    try {
      s.innerHTML = `Trying <span class="pok">${workingProxy.name}</span> (cached)...`;
      const t = await tryProxy(workingProxy, url);
      if (t) { s.innerHTML = `Via <span class="pok">${workingProxy.name}</span> ✓`; return t; }
    } catch {} workingProxy = null;
  }
  for (const p of CORS_PROXIES) {
    try {
      s.innerHTML = `Trying <span style="color:var(--yellow)">${p.name}</span>...`;
      const t = await tryProxy(p, url);
      if (t) { workingProxy = p; s.innerHTML = `Via <span class="pok">${p.name}</span> ✓`; return t; }
    } catch {}
  }
  s.innerHTML = `<span class="pfail">All proxies failed</span>`;
  return null;
}

async function tryProxy(p, url) {
  const ac = new AbortController();
  const to = setTimeout(() => ac.abort(), 15000);
  try {
    const r = await fetch(p.build(url), { signal: ac.signal });
    clearTimeout(to);
    if (!r.ok) return null;
    if (p.isJson) {
      const j = await r.json();
      const h = j.html || j.contents || j.content || '';
      return h.length > 200 ? h : null;
    }
    const t = await r.text();
    return (t.length > 200 && /<[a-z]/i.test(t)) ? t : null;
  } catch { clearTimeout(to); return null; }
}

// ─── IMAGE VALIDATION ───
// Load image and check real dimensions — rejects tracking pixels, broken images, tiny icons
function validateImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      resolve({ valid: w > 5 && h > 5, width: w, height: h, img });
    };
    img.onerror = () => resolve({ valid: false, width: 0, height: 0, img: null });
    img.src = src;
  });
}

// ─── DOM LOGO EXTRACTOR ───
function extractFromHTML(html, baseUrl) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const base = new URL(baseUrl);
  const candidates = [];

  function resolve(src) {
    if (!src) return null;
    src = src.trim();
    if (src.startsWith('data:') || src.startsWith('blob:') || src === '#' || src === '') return null;
    // Skip common junk patterns
    if (/pixel|track|blank|spacer|1x1|beacon|analytics|gtm|facebook|fbcdn.*pixel/i.test(src)) return null;
    try {
      if (src.startsWith('//')) return base.protocol + src;
      if (src.startsWith('/')) return base.origin + src;
      if (/^https?:\/\//i.test(src)) return src;
      return new URL(src, baseUrl).href;
    } catch { return null; }
  }

  function getSrc(img) {
    // Try real src first, then lazy-load fallbacks
    const attrs = ['src', 'data-src', 'data-lazy-src', 'data-original', 'data-image'];
    for (const a of attrs) {
      const v = img.getAttribute(a);
      if (v && !v.startsWith('data:image/svg+xml') && !v.startsWith('data:image/gif;base64,R0lGOD')) {
        const r = resolve(v);
        if (r) return r;
      }
    }
    // srcset first entry
    const ss = img.getAttribute('srcset');
    if (ss) {
      const first = ss.split(',')[0]?.trim()?.split(' ')[0];
      const r = resolve(first);
      if (r) return r;
    }
    return null;
  }

  function textContainsLogo(str) {
    return /logo/i.test(str || '');
  }

  function getAttrsText(el) {
    return ['class', 'id', 'alt', 'title', 'src', 'data-src', 'aria-label', 'role']
      .map(a => el.getAttribute(a) || '').join(' ');
  }

  function parentLogoSignal(el, levels = 4) {
    let p = el.parentElement;
    for (let i = 0; i < levels && p; i++) {
      if (textContainsLogo(p.getAttribute('class')) || textContainsLogo(p.getAttribute('id'))) return true;
      p = p.parentElement;
    }
    return false;
  }

  // ── Strategy 1: <img> with "logo" in attributes or parent ──
  doc.querySelectorAll('img').forEach(img => {
    const attrs = getAttrsText(img);
    const hasSignal = textContainsLogo(attrs) || parentLogoSignal(img);
    if (!hasSignal) return;
    const src = getSrc(img);
    if (!src) return;

    // Score boost if "logo" is in multiple places
    let score = 100;
    if (textContainsLogo(img.getAttribute('class'))) score += 10;
    if (textContainsLogo(img.getAttribute('alt'))) score += 10;
    if (textContainsLogo(img.getAttribute('src') || '')) score += 15;
    if (parentLogoSignal(img)) score += 5;

    // Penalize if inside footer
    if (img.closest('footer')) score -= 40;

    candidates.push({ src, score, reason: 'Logo image' });
  });

  // ── Strategy 2: <img> inside <header>/<nav> (first 3 only) ──
  doc.querySelectorAll('header img, nav img, [role="banner"] img').forEach((img, i) => {
    if (i > 2) return;
    const src = getSrc(img);
    if (src) candidates.push({ src, score: 80 - i * 10, reason: 'Header/nav image' });
  });

  // ── Strategy 3: <a href="/"> containing <img> ──
  const homeHrefs = ['/', base.origin, base.origin + '/', baseUrl];
  homeHrefs.forEach(href => {
    try {
      doc.querySelectorAll(`a[href="${href}"] img`).forEach((img, i) => {
        if (i > 0) return;
        const src = getSrc(img);
        if (src) candidates.push({ src, score: 75, reason: 'Homepage link image' });
      });
    } catch {}
  });

  // ── Strategy 4: <img> where URL path contains "logo" ──
  doc.querySelectorAll('img').forEach(img => {
    const rawSrc = (img.getAttribute('src') || img.getAttribute('data-src') || '');
    if (textContainsLogo(rawSrc)) {
      const src = getSrc(img);
      if (src) candidates.push({ src, score: 85, reason: 'URL contains "logo"' });
    }
  });

  // ── Strategy 5: og:image ──
  const ogImg = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
  if (ogImg) { const s = resolve(ogImg); if (s) candidates.push({ src: s, score: 60, reason: 'og:image', isOg: true }); }

  // ── Strategy 6: twitter:image ──
  const twImg = (doc.querySelector('meta[name="twitter:image"]') || doc.querySelector('meta[property="twitter:image"]'))?.getAttribute('content');
  if (twImg) { const s = resolve(twImg); if (s) candidates.push({ src: s, score: 55, reason: 'twitter:image', isOg: true }); }

  // ── Strategy 7: Large link icons ──
  doc.querySelectorAll('link[rel*="icon"], link[rel*="apple-touch"]').forEach(link => {
    const src = resolve(link.getAttribute('href'));
    const sz = parseInt(link.getAttribute('sizes') || '0');
    if (src && sz >= 128) candidates.push({ src, score: 45 + Math.min(sz / 10, 20), reason: `Icon ${sz}px` });
  });

  // Deduplicate
  const seen = new Set();
  const unique = [];
  for (const c of candidates.sort((a, b) => b.score - a.score)) {
    if (!c.src || seen.has(c.src)) continue;
    seen.add(c.src);
    unique.push(c);
  }
  return unique.slice(0, 8); // More candidates — we'll validate after
}

// ─── Validate & pick best logo ───
async function validateAndPickLogos(candidates, maxResults = 3) {
  const validated = [];

  for (const c of candidates) {
    const result = await validateImage(c.src);
    if (!result.valid) continue;

    const w = result.width;
    const h = result.height;

    // REJECT: tracking pixels (<=5px either dimension)
    if (w <= 5 || h <= 5) continue;

    // REJECT: standard small favicons when found via logo detection (16x16, 32x32)
    // Only reject these if they came from logo detection, not from icon strategy
    if (c.reason !== 'Icon' && w <= 32 && h <= 32) continue;

    // REJECT: suspiciously narrow/tall ratio (probably a divider line or decoration)
    const ratio = Math.max(w, h) / Math.min(w, h);
    if (ratio > 10 && (w < 20 || h < 20)) continue;

    // Score boost based on dimensions (larger = more likely to be a real logo)
    let dimBonus = 0;
    if (w >= 100 || h >= 50) dimBonus += 20;
    if (w >= 200 || h >= 80) dimBonus += 15;
    if (w >= 300) dimBonus += 10;

    // Penalize very small images even if they passed basic checks
    if (w < 50 && h < 50) dimBonus -= 20;

    validated.push({
      ...c,
      score: c.score + dimBonus,
      width: w,
      height: h,
    });
  }

  // Sort by final score and return top N
  validated.sort((a, b) => b.score - a.score);
  return validated.slice(0, maxResults);
}

// ─── UI ───
function switchMode(m) {
  currentMode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  document.getElementById('singleMode').classList.toggle('hidden', m !== 'single');
  document.getElementById('bulkMode').classList.toggle('hidden', m !== 'bulk');
}

function parseUrls() {
  if (currentMode === 'single') { const v = document.getElementById('singleUrl').value.trim(); return v ? [v] : []; }
  return document.getElementById('bulkUrls').value.split('\n').map(u => u.trim()).filter(u => u).slice(0, 50);
}

function normalizeUrl(u) { if (!/^https?:\/\//i.test(u)) u = 'https://' + u; try { return new URL(u).href; } catch { return null; } }
function getDomain(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } }
function genName(d, t) { return `${d.replace(/[^a-z0-9]/gi, '-')}-${t}`; }

// ─── MAIN ───
async function grabLogos() {
  const raw = parseUrls();
  if (!raw.length) { showToast('Enter at least one URL'); return; }
  const urls = raw.map(normalizeUrl).filter(Boolean);
  if (!urls.length) { showToast('No valid URLs'); return; }

  document.getElementById('loadingBar').classList.add('active');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('resultsContainer').classList.remove('hidden');
  document.getElementById('actionsBar').classList.remove('hidden');
  document.getElementById('grabBtn').disabled = true;

  const cont = document.getElementById('resultsContainer');

  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    const domain = getDomain(url);

    const group = document.createElement('div');
    group.className = 'site-group';
    group.innerHTML = `
      <div class="site-group-header">
        <img class="sg-favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" onerror="this.style.display='none'">
        <span class="sg-domain">${esc(domain)}</span>
        <span class="sg-status scanning" id="st-${i}">⏳ Scanning...</span>
      </div>
      <div class="site-group-cards" id="cards-${i}"></div>
    `;
    cont.appendChild(group);

    const cards = document.getElementById(`cards-${i}`);
    const st = document.getElementById(`st-${i}`);

    try {
      st.textContent = '⏳ Fetching HTML via proxy...';
      const html = await fetchHTML(url);

      let logoCount = 0;

      if (html) {
        st.textContent = '🔍 Scanning DOM for logos...';
        const rawCandidates = extractFromHTML(html, url);

        st.textContent = `🔍 Validating ${rawCandidates.length} candidates...`;
        const validLogos = await validateAndPickLogos(rawCandidates, 3);
        logoCount = validLogos.length;

        if (validLogos.length > 0) {
          // Best logo
          addCard(cards, domain, {
            src: validLogos[0].src, name: genName(domain, 'logo'),
            label: `Logo — ${validLogos[0].reason}`,
            badge: 'LOGO', badgeClass: 'badge-logo',
            dims: `${validLogos[0].width}×${validLogos[0].height}`,
          });

          // Alt logos
          validLogos.slice(1).forEach((l, idx) => {
            addCard(cards, domain, {
              src: l.src, name: genName(domain, `logo-alt-${idx + 2}`),
              label: `Alt ${idx + 2} — ${l.reason}`,
              badge: `LOGO ${idx + 2}`, badgeClass: 'badge-logo',
              dims: `${l.width}×${l.height}`,
            });
          });
        }

        // Check for og:image separately if no good logo found via img
        if (logoCount === 0) {
          const ogCandidates = rawCandidates.filter(c => c.isOg);
          for (const og of ogCandidates.slice(0, 1)) {
            const v = await validateImage(og.src);
            if (v.valid && v.width > 50 && v.height > 50) {
              addCard(cards, domain, {
                src: og.src, name: genName(domain, 'og-image'),
                label: og.reason, badge: 'OG IMAGE', badgeClass: 'badge-og',
                dims: `${v.width}×${v.height}`,
              });
              logoCount++;
            }
          }
        }
      }

      // Favicon (always)
      addCard(cards, domain, {
        src: `https://icons.duckduckgo.com/ip3/${domain}.ico`,
        name: genName(domain, 'favicon'), label: 'Favicon',
        badge: 'FAVICON', badgeClass: 'badge-favicon',
      });

      // Screenshot (always)
      addCard(cards, domain, {
        src: `https://image.thum.io/get/width/1280/crop/800/${url}`,
        name: genName(domain, 'screenshot-1280x800'), label: 'Desktop 1280×800',
        badge: 'SCREENSHOT', badgeClass: 'badge-screenshot',
      });

      if (!html) {
        st.textContent = '⚠ Proxy failed — favicon & screenshot only';
        st.className = 'sg-status partial';
      } else if (logoCount > 0) {
        st.textContent = `✓ ${logoCount} verified logo(s) + favicon + screenshot`;
        st.className = 'sg-status done';
      } else {
        st.textContent = '⚠ No valid logos found — favicon & screenshot added';
        st.className = 'sg-status partial';
      }
      updateCount();

    } catch (e) {
      st.textContent = `✗ ${e.message}`;
      st.className = 'sg-status error';
      addCard(cards, domain, { src: `https://icons.duckduckgo.com/ip3/${domain}.ico`, name: genName(domain, 'favicon'), label: 'Favicon', badge: 'FAVICON', badgeClass: 'badge-favicon' });
      addCard(cards, domain, { src: `https://image.thum.io/get/width/1280/crop/800/${url}`, name: genName(domain, 'screenshot-1280x800'), label: 'Desktop 1280×800', badge: 'SCREENSHOT', badgeClass: 'badge-screenshot' });
      updateCount();
    }

    if (i < urls.length - 1) await sleep(600);
  }

  document.getElementById('loadingBar').classList.remove('active');
  document.getElementById('grabBtn').disabled = false;
  updateCount();
}

// ─── Card ───
function addCard(cont, domain, opts) {
  const id = results.length;
  results.push({ ...opts, domain, selected: false, id, failed: false });
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${(id % 12) * 0.06}s`;
  card.id = `card-${id}`;
  card.innerHTML = `
    <div class="card-select" onclick="toggleSelect(${id}, event)" id="sel-${id}"></div>
    <div class="source-badge ${opts.badgeClass || ''}">${esc(opts.badge)}</div>
    <div class="card-img-wrap"><div class="card-spinner"></div></div>
    <div class="card-info">
      <div class="card-filename" title="${esc(opts.name)}">${esc(opts.name)}</div>
      <div class="card-meta">${esc(opts.label)}</div>
      ${opts.dims ? `<div class="card-dim">${opts.dims}</div>` : ''}
    </div>
    <div class="card-actions">
      <button class="card-btn dl" onclick="downloadSingle(${id})">Download</button>
      <button class="card-btn" onclick="copyUrl(${id})">Copy URL</button>
    </div>
  `;
  cont.appendChild(card);
  loadCardImg(id, opts.src);
}

function loadCardImg(id, src) {
  const card = document.getElementById(`card-${id}`);
  const wrap = card.querySelector('.card-img-wrap');
  const img = new Image();
  img.onload = () => {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (w <= 2 && h <= 2) {
      markFailed(id, wrap, 'Tracking pixel');
      return;
    }
    wrap.innerHTML = '';
    img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;';
    wrap.appendChild(img);
    wrap.onclick = () => previewImage(src);
    // Update dimensions display if not already set
    const dimEl = card.querySelector('.card-dim');
    if (!dimEl) {
      const info = card.querySelector('.card-info');
      const d = document.createElement('div');
      d.className = 'card-dim';
      d.textContent = `${w}×${h}`;
      info.appendChild(d);
    }
  };
  img.onerror = () => markFailed(id, wrap, 'Failed to load');
  img.src = src;
}

function markFailed(id, wrap, msg) {
  wrap.innerHTML = `<span class="img-error">⚠ ${msg}</span>`;
  results[id].failed = true;
  document.getElementById(`card-${id}`).classList.add('dimmed');
  updateCount();
}

// ─── Selection ───
function toggleSelect(id, e) {
  e.stopPropagation();
  results[id].selected = !results[id].selected;
  document.getElementById(`sel-${id}`).classList.toggle('checked', results[id].selected);
  updateCount();
}

function selectAll() {
  allSelected = !allSelected;
  results.forEach((r, i) => {
    if (!r.failed) { r.selected = allSelected; const el = document.getElementById(`sel-${i}`); if (el) el.classList.toggle('checked', allSelected); }
  });
  document.getElementById('selectAllBtn').textContent = allSelected ? 'Deselect All' : 'Select All';
  updateCount();
}

function updateCount() {
  const t = results.filter(r => !r.failed).length;
  const s = results.filter(r => r.selected && !r.failed).length;
  document.getElementById('resultCount').innerHTML = `<strong>${t}</strong> images${s ? ` · <strong>${s}</strong> selected` : ''}`;
}

// ─── Downloads ───
async function downloadSingle(id) {
  const r = results[id]; if (r.failed) return showToast('Cannot download');
  showToast('Downloading...');
  if (await dlFetch(r.src, r.name)) showToast('Downloaded!');
  else { window.open(r.src, '_blank'); showToast('Opened in tab — right-click to save'); }
}

async function dlFetch(url, name) {
  try {
    let r = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (r.ok) { const b = await r.blob(); if (b.size > 50) return dlBlob(b, name, url); }
  } catch {}
  for (const p of CORS_PROXIES) {
    try {
      const r = await fetch(p.build(url), { signal: AbortSignal.timeout(10000) });
      if (r.ok) { const b = await r.blob(); if (b.size > 50) return dlBlob(b, name, url); }
    } catch {}
  }
  return false;
}

function dlBlob(blob, name, url) {
  const ext = getExt(blob.type, url);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}.${ext}`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  return true;
}

async function downloadSelected() {
  const sel = results.filter(r => r.selected && !r.failed);
  if (!sel.length) return showToast('No images selected');
  showToast(`Downloading ${sel.length}...`);
  let ok = 0, fb = 0;
  for (const r of sel) {
    if (await dlFetch(r.src, r.name)) ok++;
    else { window.open(r.src, '_blank'); fb++; }
    await sleep(400);
  }
  showToast(fb ? `${ok} downloaded · ${fb} opened in tabs` : `${ok} downloaded!`);
}

function getExt(m, u) {
  if (m.includes('svg')) return 'svg'; if (m.includes('png')) return 'png';
  if (m.includes('gif')) return 'gif'; if (m.includes('webp')) return 'webp';
  if (m.includes('jpeg')||m.includes('jpg')) return 'jpg'; if (m.includes('icon')) return 'ico';
  const x = (u||'').match(/\.(png|jpg|jpeg|gif|svg|webp|ico)(\?|$)/i);
  return x ? x[1].toLowerCase() : 'png';
}

function copyUrl(id) { navigator.clipboard.writeText(results[id].src).then(() => showToast('URL copied!')); }

function clearAll() {
  results = []; allSelected = false;
  document.getElementById('resultsContainer').innerHTML = '';
  document.getElementById('resultsContainer').classList.add('hidden');
  document.getElementById('actionsBar').classList.add('hidden');
  document.getElementById('emptyState').classList.remove('hidden');
  document.getElementById('selectAllBtn').textContent = 'Select All';
  document.getElementById('proxyStatus').innerHTML = '';
}

function previewImage(s) { document.getElementById('previewImg').src = s; document.getElementById('previewModal').classList.add('open'); }
function closePreview() { document.getElementById('previewModal').classList.remove('open'); }
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });
</script>
